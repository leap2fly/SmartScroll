<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Browsing Control - Authentication</title>
    <link rel="stylesheet" href="password.css">
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="../assets/icon48.png" alt="Logo">
            <h1>Smart Browsing Control</h1>
        </div>

        <div id="setup-section" class="card hidden">
            <h2>Set Master Password</h2>
            <p>Create a password to protect your settings.</p>
            <form id="setup-form" autocomplete="off">
                <input type="password" id="new-password" placeholder="New Password" required autocomplete="off">
                <input type="password" id="confirm-password" placeholder="Confirm Password" required autocomplete="off">
                <button type="submit">Set Password</button>
            </form>
        </div>

        <div id="login-section" class="card hidden">
            <h2>Authentication Required</h2>
            <p>Please enter your master password to continue.</p>
            <form id="login-form" autocomplete="off">
                <input type="password" id="password" placeholder="Master Password" required autocomplete="off">
                <button type="submit">Unlock</button>
            </form>
            <p id="error-msg" class="error"></p>
        </div>

        <div id="lockout-section" class="card hidden">
            <h2 class="error">Access Locked</h2>
            <p>Too many failed attempts. Please try again in <span id="lockout-timer">5:00</span>.</p>
        </div>
    </div>
    <script type="module" src="password.js"></script>
</body>
</html>
