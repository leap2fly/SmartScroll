<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SBC - Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
    <style>
        .chart-row { display: flex; gap: 20px; margin-top: 24px; }
        .chart-box { flex: 1; min-width: 300px; }
        .bar-container { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
        .bar-item { display: flex; align-items: center; gap: 12px; }
        .bar-label { width: 100px; font-size: 0.8125rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .bar-track { flex: 1; height: 12px; background: #f3f4f6; border-radius: 6px; overflow: hidden; }
        .bar-fill { height: 100%; background: #2563eb; transition: width 0.3s; }
        .bar-value { font-size: 0.75rem; color: #6b7280; width: 40px; }
    </style>
</head>
<body class="hidden">
    <div class="sidebar">
        <div class="logo-small">
            <img src="../assets/icon48.png" alt="SBC">
            <span>SBC</span>
        </div>
        <nav>
            <a href="dashboard.html" class="active">Dashboard</a>
            <a href="../rules/rules.html">Rules</a>
            <a href="../schedules/schedules.html">Schedules</a>
            <a href="../settings/settings.html">Settings</a>
        </nav>
    </div>
    <main>
        <header>
            <h1>Productivity Dashboard</h1>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Videos Blocked</div>
                <div id="stat-videos" class="stat-value">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Reels Blocked</div>
                <div id="stat-reels" class="stat-value">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Data Saved</div>
                <div id="stat-data" class="stat-value">0 MB</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Time Saved</div>
                <div id="stat-time" class="stat-value">0 min</div>
            </div>
        </div>

        <div class="chart-row">
            <div class="card chart-box">
                <h2>Daily Trend (Time Saved)</h2>
                <div class="chart-container" style="height: 150px;">
                    <svg id="trend-svg" width="100%" height="100%" preserveAspectRatio="none">
                        <polyline id="trend-line" fill="none" stroke="#2563eb" stroke-width="3" />
                    </svg>
                </div>
            </div>
            <div class="card chart-box">
                <h2>Category Usage (Today)</h2>
                <div id="category-usage-bars" class="bar-container">
                    <!-- Progress bars -->
                </div>
            </div>
        </div>

        <div class="chart-row">
            <div class="card chart-box">
                <h2>Blocked Summary</h2>
                <div id="blocked-breakdown" class="bar-container">
                    <!-- Progress bars -->
                </div>
            </div>
            <div class="card chart-box" style="flex: 0 0 250px;">
                <h2>Sessions</h2>
                <div class="stat-card" style="box-shadow: none; border: 1px solid #e5e7eb;">
                    <div class="stat-label">Blocked Sessions</div>
                    <div id="stat-sessions" class="stat-value">0</div>
                </div>
            </div>
        </div>
    </main>
    <script type="module" src="dashboard.js"></script>
</body>
</html>
